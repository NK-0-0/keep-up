<header class="header">
  <div class="header__shell">
    <div class="brand">
      <ku-logo [size]="38" />
      <span class="brand__text">
        <span class="brand__name">KeepUp</span>
        <span class="brand__tagline">EXAM ENTRY TRACKER</span>
      </span>
    </div>

    <p class="threshold-pill">
      <span class="threshold-pill__label">Default DP bar</span>
      <span class="threshold-pill__value">{{ defaultThreshold() }}%</span>
    </p>

    <ku-avatar [photoUrl]="photoUrl()" [initials]="initials()" [size]="38" />

    @if (showSignOut()) {
      <button
        type="button"
        class="ku-button ku-button--ghost sign-out"
        [disabled]="signingOut()"
        [attr.aria-busy]="signingOut()"
        (click)="signOut.emit()"
      >
        @if (signingOut()) {
          <ku-spinner [size]="14" />
        }
        {{ signingOut() ? 'Signing out…' : 'Sign out' }}
      </button>
    }
  </div>
</header>
