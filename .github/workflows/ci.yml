name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch makes the in-flight run for that branch redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Angular's interactive prompts and analytics have no place in CI.
  NG_CLI_ANALYTICS: 'false'

jobs:
  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm run test:ci

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Speeds up the second build; keyed on the lockfile so a dependency
      # change starts from a clean cache.
      - name: Restore Angular build cache
        uses: actions/cache@v4
        with:
          path: .angular/cache
          key: angular-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: angular-cache-${{ runner.os }}-

      - name: Build (production)
        run: npm run build

      # Also builds the development configuration, so a change to
      # environment.development.ts cannot break `ng serve` unnoticed.
      - name: Build (development)
        run: npx ng build --configuration development
